name: XP preview verification
on:
  push:
    branches: [main, 'xp/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: XP-preview-apks
          path: app/build/outputs/apk/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XP-unit-results
          path: |
            app/build/test-results/
            app/build/xp-rendered/
  native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: XP-preview-apks
          path: build-apks
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          emulator-build: 15917651
          target: ${{ matrix.api == 30 && 'default' || 'aosp_atd' }}
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb install --no-streaming -r build-apks/debug/app-debug.apk
            adb install --no-streaming -r build-apks/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.nthexperience.desktop.xp.test/com.nthexperience.desktop.XpSmoke | tee xp-native.txt
            grep -q 'PASS:' xp-native.txt
            adb shell am instrument -w com.nthexperience.desktop.xp.test/com.nthexperience.desktop.XpIndependentRowsSmoke | tee xp-rows.txt
            grep -q 'PASS:' xp-rows.txt
            adb pull /sdcard/Android/data/com.nthexperience.desktop.xp/files/xp-verification screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XP-native-api-${{ matrix.api }}
          path: |
            xp-native.txt
            xp-rows.txt
            screenshots/
