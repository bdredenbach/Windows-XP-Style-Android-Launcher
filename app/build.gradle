plugins { id 'com.android.application' }
android {
    namespace 'com.nthexperience.desktop'
    compileSdk 36
    buildFeatures { buildConfig = true }
    defaultConfig {
        applicationId rootProject.ext.launcherApplicationId
        manifestPlaceholders.launcherApplicationId = applicationId
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '0.5.0'
        testInstrumentationRunner 'com.nthexperience.desktop.XpSmoke'
    }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The engine is the installed Android WebView, independently updated by its provider.
dependencies {
    implementation "androidx.webkit:webkit:1.13.0"
    implementation "androidx.media3:media3-exoplayer:1.10.1"
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
}
